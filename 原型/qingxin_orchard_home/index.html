<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef8ed">
  <title>清新果园 · 农产品展示</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell">
    <div class="status-bar" aria-label="状态栏"><span>9:41</span><span class="status-icons">▮▮▮　◉　▰</span></div>
    <header class="brand-row">
      <div class="brand"><div class="brand-logo" aria-hidden="true"><i></i></div><div><strong>清新果园</strong><small>源自自然 · 健康美味</small></div></div>
      <button class="region-button" id="regionButton"><span class="map-pin"></span>全国 <span class="chevron">⌄</span></button>
    </header>
    <label class="search-box"><span class="search-icon" aria-hidden="true"></span><input id="searchInput" type="search" placeholder="搜索你想要的农产品..." autocomplete="off"><button class="clear-search" id="clearSearch" aria-label="清空搜索">×</button></label>
    <section class="hero" aria-label="果园推荐">
      <img src="assets/images/hero.jpg" alt="果园和篮装苹果">
    </section>
    <section class="category-strip" aria-label="产品分类">
      <button class="category" data-category="水果"><span class="category-art art-fruit">🍎</span><span>时令水果</span></button>
      <button class="category" data-category="蔬菜"><span class="category-art art-vegetable">🥬</span><span>蔬菜鲜货</span></button>
      <button class="category" data-category="粮油"><span class="category-art art-grain">🌾</span><span>粮油杂粮</span></button>
      <button class="category" data-category="坚果"><span class="category-art art-nut">🌰</span><span>坚果干果</span></button>
      <button class="category" data-category="特产"><span class="category-art art-special">🏡</span><span>农家特产</span></button>
    </section>
    <section class="recommend-section">
      <div class="section-heading"><h2><span class="leaf-mark">❧</span>为你推荐</h2><button class="more-button" id="moreButton">查看更多 <span>›</span></button></div>
      <div class="product-grid" id="productGrid">
        <article class="product-card" data-name="云南高原红富士苹果" data-category="水果" data-origin="云南 · 昭通" data-desc="高原果园自然生长，果香浓郁，脆甜多汁。">
          <button class="product-open" aria-label="查看云南高原红富士苹果详情"><div class="product-photo"><img src="assets/images/apples.jpg" alt="红富士苹果"></div><div class="product-content"><h3>云南高原红富士苹果</h3><p class="origin">云南 · 昭通</p><div class="product-footer"><span class="product-description">高原种植 · 自然成熟</span><span class="view-pill">立即查看</span></div></div></button>
        </article>
        <article class="product-card" data-name="赣南脐橙" data-category="水果" data-origin="江西 · 赣州" data-desc="果园新鲜采摘，橙香清新，汁水饱满。">
          <button class="product-open" aria-label="查看赣南脐橙详情"><div class="product-photo"><img src="assets/images/oranges.jpg" alt="新鲜脐橙"></div><div class="product-content"><h3>赣南脐橙</h3><p class="origin">江西 · 赣州</p><div class="product-footer"><span class="product-description">果园采摘 · 清甜多汁</span><span class="view-pill">立即查看</span></div></div></button>
        </article>
        <article class="product-card" data-name="新鲜上海青" data-category="蔬菜" data-origin="江苏 · 南通" data-desc="清晨采摘，鲜嫩爽口，适合家常烹饪。">
          <button class="product-open" aria-label="查看新鲜上海青详情"><div class="product-photo"><img src="assets/images/greens.jpg" alt="新鲜上海青"></div><div class="product-content"><h3>新鲜上海青</h3><p class="origin">江苏 · 南通</p><div class="product-footer"><span class="product-description">清晨采摘 · 鲜嫩爽口</span><span class="view-pill">立即查看</span></div></div></button>
        </article>
        <article class="product-card" data-name="沙地红薯" data-category="特产" data-origin="山东 · 临沂" data-desc="沙地种植，口感香甜软糯，适合蒸煮烘烤。">
          <button class="product-open" aria-label="查看沙地红薯详情"><div class="product-photo"><img src="assets/images/sweetpotato.jpg" alt="沙地红薯"></div><div class="product-content"><h3>沙地红薯</h3><p class="origin">山东 · 临沂</p><div class="product-footer"><span class="product-description">沙地种植 · 香甜软糯</span><span class="view-pill">立即查看</span></div></div></button>
        </article>
      </div>
      <p class="empty-state" id="emptyState" hidden>没有找到相关农产品，试试其他关键词吧。</p>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="底部导航"><button class="nav-item active" data-page="首页"><span class="nav-symbol home-symbol">⌂</span><span>首页</span></button><button class="nav-item" data-page="分类"><span class="nav-symbol grid-symbol">▦</span><span>分类</span></button><button class="nav-item" data-page="我的"><span class="nav-symbol user-symbol">♙</span><span>我的</span></button></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="product-dialog" id="productDialog"><button class="dialog-close" id="dialogClose" aria-label="关闭">×</button><img id="dialogImage" alt="产品图片"><div class="dialog-body"><span class="dialog-tag">农产品展示</span><h2 id="dialogTitle"></h2><p class="dialog-origin" id="dialogOrigin"></p><p id="dialogDescription"></p><button class="dialog-action" id="dialogAction">了解产品</button></div></dialog>
  <script src="js/app.js"></script>
</body>
</html>
